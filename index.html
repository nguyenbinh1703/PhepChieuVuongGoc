<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
    <title>Mô Hình Thí Nghiệm</title>
    <meta name="description" content="Mô hình thí nghiệm phép chiếu song song và phép chiếu vuông góc." />
    <meta property="og:title" content="Mô Hình Thí Nghiệm" />
    <meta property="og:description" content="Mô phỏng 3D buồng kính thí nghiệm quang học thực hành phép chiếu song song và phép chiếu vuông góc với nguồn sáng laser tự do điều chỉnh góc và độ cao." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;z-index:99999;user-select:none;-webkit-user-select:none;">
        <div style="width:36px;height:36px;border-radius:50%;border:3px solid #e2e8f0;border-top-color:#0284c7;animation:spin 0.8s linear infinite;margin-bottom:14px;"></div>
        <div style="font-size:15px;font-weight:600;letter-spacing:-0.01em;color:#334155;">
          Đang tải...
        </div>
        <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
