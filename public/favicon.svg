<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background circular badge -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>

  <!-- 3D Isometric Cube / Prism representing 3D Lab -->
  <!-- Top Face -->
  <polygon points="16,9 24,13.5 16,18 8,13.5" fill="url(#cubeTop)"/>
  <!-- Left Face -->
  <polygon points="8,13.5 16,18 16,26.5 8,22" fill="url(#cubeLeft)"/>
  <!-- Right Face -->
  <polygon points="16,18 24,13.5 24,22 16,26.5" fill="url(#cubeRight)"/>

  <!-- Precision Optical Edge Lines -->
  <line x1="16" y1="9" x2="24" y2="13.5" stroke="#7dd3fc" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="8" y1="13.5" x2="16" y2="9" stroke="#7dd3fc" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="16" y2="26.5" stroke="#bae6fd" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Laser Beam Angle Projector -->
  <line x1="27" y1="5" x2="16" y2="18" stroke="url(#laserBeam)" stroke-width="1.8" stroke-linecap="round" filter="url(#laserGlow)"/>
  <!-- Laser Beam Core Core -->
  <line x1="27" y1="5" x2="16" y2="18" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Target Impact Point on Specimen -->
  <circle cx="16" cy="18" r="1.5" fill="#f43f5e"/>
  <circle cx="16" cy="18" r="0.6" fill="#ffffff"/>
</svg>
